name: Dev instruction mirrors

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target_sha:
        description: Full lowercase commit SHA to verify (defaults to the dispatch commit)
        required: false
        type: string

permissions:
  contents: read

jobs:
  mirrors:
    name: Generated mirrors
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the proposed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.target_sha }}

      - name: Verify the tested commit
        env:
          TARGET_SHA: ${{ inputs.target_sha || github.sha }}
        run: |
          if [[ ! "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::target_sha must be a full lowercase 40-hex commit SHA"
            exit 1
          fi
          actual_sha="$(git rev-parse HEAD)"
          if [[ "$actual_sha" != "$TARGET_SHA" ]]; then
            echo "::error::Checked out $actual_sha instead of target $TARGET_SHA"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install mirror test dependency
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3

      - name: Test CI workflow topology
        run: python -m unittest -v test_scripts.test_ci_workflow

      - name: Test mirror synchronization
        run: python -m unittest -v test_scripts.test_sync_dev_instructions

      - name: Regenerate the mirrors
        run: bash scripts/sync_dev_instructions.sh

      - name: Require the committed mirrors to match
        shell: bash
        run: |
          git add -A -f -- AGENTS.md .agents/skills
          if ! git diff --cached --exit-code HEAD -- AGENTS.md .agents/skills; then
            echo "::error::Generated dev-instruction mirrors are stale. Run bash scripts/sync_dev_instructions.sh, commit the result, and push again."
            exit 1
          fi

  results_pipeline:
    name: Computed-results provenance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the proposed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.target_sha }}

      - name: Verify the tested commit
        env:
          TARGET_SHA: ${{ inputs.target_sha || github.sha }}
        run: |
          if [[ ! "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::target_sha must be a full lowercase 40-hex commit SHA"
            exit 1
          fi
          actual_sha="$(git rev-parse HEAD)"
          if [[ "$actual_sha" != "$TARGET_SHA" ]]; then
            echo "::error::Checked out $actual_sha instead of target $TARGET_SHA"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Bubblewrap sandbox profile
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends apparmor-profiles bubblewrap
          sudo install -m 0644 /usr/share/apparmor/extra-profiles/bwrap-userns-restrict /etc/apparmor.d/bwrap-userns-restrict
          sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict

      - name: Verify Bubblewrap sandbox capability
        run: |
          /usr/bin/bwrap --help | grep -Fq -- "--ro-bind-fd"
          /usr/bin/bwrap --ro-bind / / -- /usr/bin/true

      - name: Test computed-results provenance utility
        run: /usr/bin/python3 test_scripts/test_results_pipeline.py

      - name: Test empirical analysis-contract lineage
        run: /usr/bin/python3 test_scripts/test_analysis_contract.py

  evidence_assembly:
    name: Evidence and setup contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the proposed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.target_sha }}

      - name: Verify the tested commit
        env:
          TARGET_SHA: ${{ inputs.target_sha || github.sha }}
        run: |
          if [[ ! "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::target_sha must be a full lowercase 40-hex commit SHA"
            exit 1
          fi
          actual_sha="$(git rev-parse HEAD)"
          if [[ "$actual_sha" != "$TARGET_SHA" ]]; then
            echo "::error::Checked out $actual_sha instead of target $TARGET_SHA"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Bubblewrap sandbox profile
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends apparmor-profiles bubblewrap
          sudo install -m 0644 /usr/share/apparmor/extra-profiles/bwrap-userns-restrict /etc/apparmor.d/bwrap-userns-restrict
          sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict

      - name: Verify Bubblewrap sandbox capability
        run: |
          /usr/bin/bwrap --help | grep -Fq -- "--ro-bind-fd"
          /usr/bin/bwrap --ro-bind / / -- /usr/bin/true

      - name: Test fast setup contracts
        run: |
          bash test_scripts/test_setup_config.sh
          bash test_scripts/test_setup_cleanup.sh

      - name: Test computed-results cross-shape assembly
        run: bash test_scripts/test_results_evidence_assembly.sh

      - name: Test empirical replication input binding
        run: /usr/bin/python3 deploy_assets/scripts/test_empirical_input_manifest.py

  runtime:
    name: Runtime integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the proposed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.target_sha }}

      - name: Verify the tested commit
        env:
          TARGET_SHA: ${{ inputs.target_sha || github.sha }}
        run: |
          if [[ ! "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::target_sha must be a full lowercase 40-hex commit SHA"
            exit 1
          fi
          actual_sha="$(git rev-parse HEAD)"
          if [[ "$actual_sha" != "$TARGET_SHA" ]]; then
            echo "::error::Checked out $actual_sha instead of target $TARGET_SHA"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Python test dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          PyYAML==6.0.3 pandas python-dotenv wrds==3.5.0 openai anthropic

      - name: Test DeepVest parsers without paid calls
        env:
          DEEPVEST_TEST_OFFLINE: "1"
          PYTHONPATH: deploy_assets/extensions/empirical
        run: python3 test_scripts/test_deepvest.py

      - name: Test theory_llm client backend resolution (offline)
        run: python -m unittest -v test_scripts.test_llm_client_backends

      - name: Test Codex native subagent assembly
        run: python3 deploy_assets/scripts/test_assemble_codex_subagents.py

      - name: Test Codex driver timeout and cohort cleanup
        run: bash deploy_assets/scripts/test_codex_driver_watchdog.sh

      - name: Run Codex native live canary when explicitly enabled
        run: bash deploy_assets/scripts/test_codex_native_live.sh

      - name: Test WRDS cross-sandbox transport and login latch
        run: |
          python3 deploy_assets/scripts/test_wrds_unix_socket.py
          bash deploy_assets/scripts/test_wrds_auth_latch.sh
          bash deploy_assets/scripts/test_launch_wrds_prestart.sh
          bash deploy_assets/scripts/test_wrds_turn_survival.sh
          bash deploy_assets/scripts/test_launch_wrds_opencode.sh

      - name: Test IBES skill guidance
        run: python3 deploy_assets/scripts/test_ibes_skill.py

  table_gate:
    name: Rendered-table gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the proposed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.target_sha }}

      - name: Verify the tested commit
        env:
          TARGET_SHA: ${{ inputs.target_sha || github.sha }}
        run: |
          if [[ ! "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::target_sha must be a full lowercase 40-hex commit SHA"
            exit 1
          fi
          actual_sha="$(git rev-parse HEAD)"
          if [[ "$actual_sha" != "$TARGET_SHA" ]]; then
            echo "::error::Checked out $actual_sha instead of target $TARGET_SHA"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install LaTeX table-gate dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends bubblewrap texlive-latex-extra

      - name: Test rendered-table source gate
        run: bash test_scripts/test_table_legibility.sh

  source_policy:
    name: Checkout-local source policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the proposed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.target_sha }}

      - name: Verify the tested commit
        env:
          TARGET_SHA: ${{ inputs.target_sha || github.sha }}
        run: |
          if [[ ! "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::target_sha must be a full lowercase 40-hex commit SHA"
            exit 1
          fi
          actual_sha="$(git rev-parse HEAD)"
          if [[ "$actual_sha" != "$TARGET_SHA" ]]; then
            echo "::error::Checked out $actual_sha instead of target $TARGET_SHA"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Test checkout-local setup source policy
        run: bash test_scripts/test_setup_source_policy.sh

  ownership:
    name: Infrastructure and bootstrap ownership (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard:
          - base
          - update_safety
          - evidence_state
          - routing_locking
    steps:
      - name: Check out the proposed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.target_sha }}

      - name: Verify the tested commit
        env:
          TARGET_SHA: ${{ inputs.target_sha || github.sha }}
        run: |
          if [[ ! "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::target_sha must be a full lowercase 40-hex commit SHA"
            exit 1
          fi
          actual_sha="$(git rev-parse HEAD)"
          if [[ "$actual_sha" != "$TARGET_SHA" ]]; then
            echo "::error::Checked out $actual_sha instead of target $TARGET_SHA"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Prepare the ownership harness
        env:
          HISTORICAL_TARGET: ${{ inputs.target_sha }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          harness="$RUNNER_TEMP/test_setup_ownership.sh"
          if [[ -n "$HISTORICAL_TARGET" ]]; then
            git fetch --no-tags --depth=1 origin "$WORKFLOW_SHA"
            git show "$WORKFLOW_SHA:test_scripts/test_setup_ownership.sh" > "$harness"
          else
            cp test_scripts/test_setup_ownership.sh "$harness"
          fi
          chmod 0555 "$harness"
          echo "OWNERSHIP_HARNESS=$harness" >> "$GITHUB_ENV"

      - name: Test infrastructure/bootstrap ownership
        env:
          OWNERSHIP_SOURCE_ROOT: ${{ github.workspace }}
          OWNERSHIP_TEST_SHARD: ${{ matrix.shard }}
          TMPDIR: /dev/shm
        run: bash "$OWNERSHIP_HARNESS"

  setup_integration:
    name: Setup integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the proposed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.target_sha }}

      - name: Verify the tested commit
        env:
          TARGET_SHA: ${{ inputs.target_sha || github.sha }}
        run: |
          if [[ ! "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::target_sha must be a full lowercase 40-hex commit SHA"
            exit 1
          fi
          actual_sha="$(git rev-parse HEAD)"
          if [[ "$actual_sha" != "$TARGET_SHA" ]]; then
            echo "::error::Checked out $actual_sha instead of target $TARGET_SHA"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install setup prerequisite
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends bubblewrap

      - name: Test production provisioning and publication
        run: bash test_scripts/test_setup_publish.sh

      - name: Test seeded Gate 4 routing
        run: bash test_scripts/test_seeded_gate4_assembly.sh

      - name: Test Stage 0 discovery cap
        run: bash test_scripts/test_stage0_discovery_cap.sh

  characterization:
    name: Setup characterization
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the proposed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.target_sha }}

      - name: Verify the tested commit
        env:
          TARGET_SHA: ${{ inputs.target_sha || github.sha }}
        run: |
          if [[ ! "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::target_sha must be a full lowercase 40-hex commit SHA"
            exit 1
          fi
          actual_sha="$(git rev-parse HEAD)"
          if [[ "$actual_sha" != "$TARGET_SHA" ]]; then
            echo "::error::Checked out $actual_sha instead of target $TARGET_SHA"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Characterize setup assembly
        run: >-
          python test_scripts/test_setup_characterization.py
          --actual "${{ runner.temp }}/setup-characterization/actual.json"
          --artifacts-dir "${{ runner.temp }}/setup-characterization/artifacts"

      - name: Upload setup characterization failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: setup-characterization-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/setup-characterization/actual.json
            ${{ runner.temp }}/setup-characterization/artifacts
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  verify:
    name: Verify generated mirrors
    if: ${{ always() }}
    needs:
      - mirrors
      - results_pipeline
      - evidence_assembly
      - runtime
      - table_gate
      - source_policy
      - ownership
      - setup_integration
      - characterization
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every test job to pass
        env:
          TEST_JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          failures="$(jq -r 'to_entries[] | select(.value.result != "success") | "\(.key): \(.value.result)"' <<<"$TEST_JOB_RESULTS")"
          if [[ -n "$failures" ]]; then
            echo "::error::One or more test jobs did not pass:"
            echo "$failures"
            exit 1
          fi
          echo "All test jobs passed."
